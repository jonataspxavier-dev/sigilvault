[package]
name = "sigilvault-core"
version = "0.1.0"
edition = "2024"
description = "Núcleo do SigilVault: cofre criptografado, slots de chave, códigos de recuperação e gerador / SigilVault core: encrypted vault, key slots, recovery codes and generator"
license = "UNLICENSED"
publish = false

[dependencies]
# Criptografia (RustCrypto + dalek) / Cryptography (RustCrypto + dalek)
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13.0"
sha2 = "0.11.1"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
# Aleatoriedade do sistema operacional / Operating system randomness
getrandom = "0.4.3"
# Apagar segredos da memória / Wipe secrets from memory
zeroize = { version = "1.9.2", features = ["derive"] }
# Serialização / Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Utilidades / Utilities
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zxcvbn = "3.1.1"
csv = "1.4.0"
quick-xml = "0.42.0"
# Endereços de sites (padrão WHATWG, com punycode) / Website addresses (WHATWG standard, with punycode)
url = "2.5.8"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
