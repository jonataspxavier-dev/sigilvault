[package]
name = "sigilvault-host"
version = "0.1.0"
edition = "2024"
description = "Host do Native Messaging: repassa mensagens entre o navegador e o app / Native Messaging host: relays messages between the browser and the app"
license = "UNLICENSED"
publish = false

[[bin]]
name = "sigilvault-host"
path = "src/main.rs"

[dependencies]
sigilvault-ipc = { path = "../ipc" }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
