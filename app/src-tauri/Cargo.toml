[package]
name = "sigilvault-app"
version = "0.1.1"
edition = "2024"
description = "App desktop do SigilVault / SigilVault desktop app"
license = "UNLICENSED"
publish = false

[lib]
name = "sigilvault_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
sigilvault-core = { path = "../../core" }
sigilvault-pairing = { path = "../../crates/pairing" }
sigilvault-ipc = { path = "../../crates/ipc" }
getrandom = "0.4.3"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.2"
sha2 = "0.11.1"
tauri-plugin-dialog = "2.8.4"

[target."cfg(windows)".dependencies]
# UI Automation (campos de senha de outros programas); a mesma versão que o Tauri já usa.
# UI Automation (other programs' password fields); the same version Tauri already uses.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_ErrorReporting", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_HiDpi"] }
